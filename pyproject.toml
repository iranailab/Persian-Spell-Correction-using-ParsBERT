[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persian-spell-correction"
version = "0.2.0"
description = "Context-aware Persian spell correction using a Norvig spell checker and ParsBERT."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9,<3.12"
keywords = ["persian", "farsi", "spell-checker", "nlp", "bert", "parsbert"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Persian",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "hazm>=0.10,<0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff==0.6.5",
    "black==24.8.0",
    "pre-commit>=3",
]

[project.scripts]
persian-spell-correct = "spell_correction.__main__:main"

[project.urls]
Repository = "https://github.com/iranailab/Persian-Spell-Correction-using-ParsBERT"

[tool.setuptools]
py-modules = ["Spell_correction"]

[tool.setuptools.packages.find]
include = ["spell_correction*"]

[tool.setuptools.package-data]
"spell_correction.data_wiki" = ["*.txt"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by black
    "RUF001", # Persian characters look ambiguous to ruff
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Module names predate PEP 8 and are kept for backwards compatibility.
"spell_correction/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests that load the full corpus and download ParsBERT (slow)",
]

[tool.coverage.run]
source = ["spell_correction", "Spell_correction"]
omit = ["spell_correction/MaskedSentencePredictor.py", "spell_correction/__main__.py"]
